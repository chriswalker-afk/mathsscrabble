<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="scene-title scene-description">
<title id="scene-title">Three illustrations from the EQUA//NOVA visual field guide</title>
<desc id="scene-description">A luminous equation reactor, a ship navigating a purple nebula and a warm space repair workshop. They demonstrate the game's playful retro-futuristic art direction.</desc>
<defs>
 <linearGradient id="reactor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#214d5b"/><stop offset="1" stop-color="#0d1f32"/></linearGradient>
 <linearGradient id="drift" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f426e"/><stop offset=".65" stop-color="#202d50"/><stop offset="1" stop-color="#121a31"/></linearGradient>
 <linearGradient id="dock" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#544c48"/><stop offset=".65" stop-color="#224554"/><stop offset="1" stop-color="#091b2b"/></linearGradient>
 <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e0dbc6"/><stop offset=".5" stop-color="#79a8a5"/><stop offset="1" stop-color="#315668"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#e7ffdf"/><stop offset=".3" stop-color="#93f8d4"/><stop offset=".8" stop-color="#3caaac"/><stop offset="1" stop-color="#165267"/></radialGradient>
 <radialGradient id="nebula"><stop stop-color="#b7a0ee" stop-opacity=".55"/><stop offset="1" stop-color="#a28be5" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
 <clipPath id="one"><rect width="392" height="400" rx="20"/></clipPath>
 <clipPath id="two"><rect x="404" width="392" height="400" rx="20"/></clipPath>
 <clipPath id="three"><rect x="808" width="392" height="400" rx="20"/></clipPath>
</defs>
