<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="crew-title crew-desc">
<title id="crew-title">Salvage Bay repair crew</title>
<desc id="crew-desc">A cheerful teal alien engineer with a toolbelt, goggles and a spanner works beside a tiny hovering diagnostic drone, repair carts and glowing equipment drawers in the orbital workshop.</desc>
<defs>
 <linearGradient id="teal-body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b6f9df"/><stop offset=".55" stop-color="#5bbcb6"/><stop offset="1" stop-color="#2b798c"/></linearGradient>
 <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6dfb2"/><stop offset=".5" stop-color="#bd9c70"/><stop offset="1" stop-color="#6a6670"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#dbeadd"/><stop offset=".38" stop-color="#78989d"/><stop offset="1" stop-color="#2b4b5d"/></linearGradient>
 <radialGradient id="torch"><stop stop-color="#fffbd7" stop-opacity=".95"/><stop offset=".25" stop-color="#f5d797" stop-opacity=".48"/><stop offset="1" stop-color="#f5d797" stop-opacity="0"/></radialGradient>
</defs>
