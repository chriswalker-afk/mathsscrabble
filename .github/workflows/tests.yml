name: Prototype rule tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  worker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cloudflare Vite build tool and CLI
        run: npm install --no-package-lock
      - name: Validate Durable Object Worker without deploying
        run: npx cf deploy --dry-run
      - name: Exercise actual local Durable Object runtime
        run: |
          npx cf dev >/tmp/equanova-cf-dev.log 2>&1 &
          WORKER_PID=$!
          trap 'kill $WORKER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health || (cat /tmp/equanova-cf-dev.log && exit 1)
          node tests/online-worker-runtime.mjs
  alien-art:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SVG artwork browser checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Raster-check all alien SVGs and anatomical combinations
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/equanova-alien-server.log 2>&1 &
          sleep 2
          node tests/alien-art-browser.mjs
          node tests/alien-editor-browser.mjs
          node tests/alien-a3-browser.mjs
          node tests/alien-multiplayer-browser.mjs
      - name: Upload specimen vault screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equanova-alien-gallery
          path: /tmp/equanova-alien-*.png
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise live board and responsive screens
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/equanova-server.log 2>&1 &
          sleep 2
          node tests/home-browser.mjs
          node tests/browser-smoke.mjs
          node tests/rogue-browser.mjs
          node tests/ceremony-browser.mjs
          node tests/local-browser.mjs
          node tests/online-browser.mjs
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equanova-browser-layouts
          path: /tmp/equanova-*.png
          if-no-files-found: ignore
