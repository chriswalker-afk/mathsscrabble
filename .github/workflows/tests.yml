name: Prototype rule tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise live board and responsive screens
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/equanova-server.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs
          node tests/rogue-browser.mjs
          node tests/ceremony-browser.mjs
          node tests/local-browser.mjs
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equanova-browser-layouts
          path: /tmp/equanova-*.png
          if-no-files-found: ignore
